<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#faf8ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>2048</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #faf8ef; color: #776e65;
    font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
    user-select: none; -webkit-user-select: none; overscroll-behavior: none;
  }
  body { touch-action: none; overflow: hidden; }
  .homeLink {
    position: absolute; top: calc(env(safe-area-inset-top) + 10px); left: 10px; z-index: 20;
    padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.38); color: #fff !important;
    font: 700 13px system-ui, -apple-system, "Segoe UI", sans-serif; text-decoration: none; letter-spacing: .2px;
  }
  .homeLink:active { transform: scale(.96); }
  #app {
    --w: min(92vw, 470px, calc((100dvh - 230px) * 1));
    width: var(--w); margin: 0 auto; padding-top: calc(env(safe-area-inset-top) + 48px);
    display: flex; flex-direction: column; gap: 14px;
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { margin: 0; font-size: calc(var(--w) * 0.17); font-weight: 700; line-height: 1; letter-spacing: -1px; }
  .scores { display: flex; gap: 6px; }
  .box {
    position: relative; background: #bbada0; border-radius: 6px; padding: 6px 12px 7px; min-width: 66px; text-align: center;
    color: #fff; font-weight: 700; font-size: 22px; line-height: 1.1;
  }
  .box small { display: block; font-size: 11px; color: #eee4da; letter-spacing: 1px; text-transform: uppercase; }
  .plus { position: absolute; right: 12px; top: 6px; color: rgba(119,110,101,.9); font-size: 20px; font-weight: 700; pointer-events: none; animation: rise .6s ease-in forwards; }
  @keyframes rise { to { transform: translateY(-36px); opacity: 0; } }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .bar p { margin: 0; font-size: 15px; line-height: 1.3; }
  .btns { display: flex; gap: 6px; flex: none; }
  button {
    border: 0; border-radius: 6px; background: #8f7a66; color: #f9f6f2; font: inherit; font-weight: 700; font-size: 15px;
    padding: 10px 14px; cursor: pointer;
  }
  button:disabled { opacity: .45; }
  button:active:not(:disabled) { transform: translateY(1px); }

  #board {
    --gap: calc(var(--w) * 0.03); --t: calc((var(--w) - var(--gap) * 5) / 4);
    position: relative; width: var(--w); height: var(--w); background: #bbada0; border-radius: 8px; touch-action: none;
  }
  .cell, .tile { position: absolute; width: var(--t); height: var(--t); border-radius: 5px; }
  .cell { background: rgba(238, 228, 218, .35); }
  .tile {
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    left: calc(var(--gap) + var(--x) * (var(--t) + var(--gap))); top: calc(var(--gap) + var(--y) * (var(--t) + var(--gap)));
    transition: left .1s ease-in-out, top .1s ease-in-out; z-index: 1;
  }
  .tile .in { width: 100%; height: 100%; border-radius: 5px; display: flex; align-items: center; justify-content: center; }
  .tile.new .in { animation: appear .2s ease .1s backwards; }
  .tile.merged { z-index: 2; }
  .tile.merged .in { animation: pop .2s ease .1s backwards; }
  @keyframes appear { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  @keyframes pop { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

  .v2 .in { background: #eee4da; } .v4 .in { background: #ede0c8; }
  .v8 .in { background: #f2b179; color: #f9f6f2; } .v16 .in { background: #f59563; color: #f9f6f2; }
  .v32 .in { background: #f67c5f; color: #f9f6f2; } .v64 .in { background: #f65e3b; color: #f9f6f2; }
  .v128 .in { background: #edcf72; color: #f9f6f2; box-shadow: 0 0 30px 10px rgba(243,215,116,.24), inset 0 0 0 1px rgba(255,255,255,.14); }
  .v256 .in { background: #edcc61; color: #f9f6f2; box-shadow: 0 0 30px 10px rgba(243,215,116,.32), inset 0 0 0 1px rgba(255,255,255,.19); }
  .v512 .in { background: #edc850; color: #f9f6f2; box-shadow: 0 0 30px 10px rgba(243,215,116,.4), inset 0 0 0 1px rgba(255,255,255,.24); }
  .v1024 .in { background: #edc53f; color: #f9f6f2; box-shadow: 0 0 30px 10px rgba(243,215,116,.48), inset 0 0 0 1px rgba(255,255,255,.29); }
  .v2048 .in { background: #edc22e; color: #f9f6f2; box-shadow: 0 0 30px 10px rgba(243,215,116,.56), inset 0 0 0 1px rgba(255,255,255,.33); }
  .vsuper .in { background: #3c3a32; color: #f9f6f2; }
  .d1 .in, .d2 .in { font-size: calc(var(--t) * 0.5); }
  .d3 .in { font-size: calc(var(--t) * 0.42); }
  .d4 .in { font-size: calc(var(--t) * 0.33); }
  .d5 .in, .d6 .in { font-size: calc(var(--t) * 0.26); }

  .msg {
    position: absolute; inset: 0; z-index: 10; border-radius: 8px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; animation: fade .6s ease .3s backwards;
  }
  .msg.lose { background: rgba(238, 228, 218, .73); }
  .msg.win { background: rgba(237, 194, 46, .5); color: #f9f6f2; }
  .msg h2 { margin: 0; font-size: calc(var(--w) * 0.12); }
  .msg[hidden] { display: none; }
  @keyframes fade { from { opacity: 0; } }
  .how { font-size: 14px; line-height: 1.45; color: #8f7a66; }
  .how b { color: #776e65; }
</style>
</head>
<body>
<a class="homeLink" href="../">← All games</a>
<div id="app">
  <div class="top">
    <h1>2048</h1>
    <div class="scores">
      <div class="box" id="scoreBox"><small>Score</small><span id="score">0</span></div>
      <div class="box"><small>Best</small><span id="best">0</span></div>
    </div>
  </div>
  <div class="bar">
    <p>Join the numbers and get to the <b>2048 tile!</b></p>
    <div class="btns"><button id="undoBtn" title="Undo last move">↶ Undo</button><button id="newBtn">New</button></div>
  </div>
  <div id="board">
    <div class="msg lose" id="lose" hidden><h2>Game over!</h2><button class="again">Try again</button></div>
    <div class="msg win" id="win" hidden><h2>You win!</h2><div class="btns"><button id="keepBtn">Keep going</button><button class="again">Try again</button></div></div>
  </div>
  <div class="how"><b>How to play:</b> swipe (or use the arrow keys) to move all tiles. When two tiles with the same number touch, they <b>merge into one!</b></div>
</div>

<script>
(() => {
  const N = 4;
  const $ = id => document.getElementById(id);
  const board = $("board");
  let grid, score, best = +localStorage.getItem("g2048.best") || 0, won, keepPlaying, over, idSeq = 0, undoState = null;

  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const c = document.createElement("div"); c.className = "cell";
    c.style.left = `calc(var(--gap) + ${x} * (var(--t) + var(--gap)))`; c.style.top = `calc(var(--gap) + ${y} * (var(--t) + var(--gap)))`;
    board.appendChild(c);
  }

  // ---------- tiles ----------
  function makeTile(value, x, y, cls) {
    const el = document.createElement("div");
    el.innerHTML = '<div class="in"></div>';
    const t = { id: ++idSeq, value, x, y, el };
    paint(t, cls);
    board.appendChild(el);
    return t;
  }
  function paint(t, cls = "") {
    const v = t.value > 2048 ? "super" : t.value;
    t.el.className = `tile v${v} d${String(t.value).length} ${cls}`;
    t.el.style.setProperty("--x", t.x); t.el.style.setProperty("--y", t.y);
    t.el.firstChild.textContent = t.value;
  }

  const empty = () => { const out = []; for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!grid[y][x]) out.push([x, y]); return out; };
  function addRandom() {
    const cells = empty(); if (!cells.length) return;
    const [x, y] = cells[(Math.random() * cells.length) | 0];
    grid[y][x] = makeTile(Math.random() < 0.9 ? 2 : 4, x, y, "new");
  }

  function clearBoard() { board.querySelectorAll(".tile").forEach(e => e.remove()); }

  function load(values, sc, w, kp) {
    clearBoard();
    grid = Array.from({ length: N }, () => Array(N).fill(null));
    values.forEach((row, y) => row.forEach((v, x) => { if (v) grid[y][x] = makeTile(v, x, y, ""); }));
    score = sc; won = w; keepPlaying = kp; over = false;
    $("lose").hidden = true; $("win").hidden = true;
    updateScore(0);
  }

  function newGame() {
    clearBoard();
    grid = Array.from({ length: N }, () => Array(N).fill(null));
    score = 0; won = false; keepPlaying = false; over = false; undoState = null;
    $("lose").hidden = true; $("win").hidden = true;
    addRandom(); addRandom();
    updateScore(0); save();
  }

  const snapshot = () => ({ cells: grid.map(r => r.map(t => (t ? t.value : 0))), score, won, keepPlaying });
  function save() {
    localStorage.setItem("g2048.state", JSON.stringify(over ? null : snapshot()));
    $("undoBtn").disabled = !undoState;
  }

  function updateScore(add) {
    $("score").textContent = score;
    if (score > best) { best = score; localStorage.setItem("g2048.best", best); }
    $("best").textContent = best;
    if (add > 0) {
      const p = document.createElement("div"); p.className = "plus"; p.textContent = "+" + add;
      $("scoreBox").appendChild(p); setTimeout(() => p.remove(), 650);
    }
  }

  // ---------- moving ----------
  const VEC = { up: [0, -1], right: [1, 0], down: [0, 1], left: [-1, 0] };
  let busy = false;

  function move(dir) {
    if (over || busy || !$("win").hidden) return;
    const [dx, dy] = VEC[dir];
    const xs = [0, 1, 2, 3], ys = [0, 1, 2, 3];
    if (dx === 1) xs.reverse();
    if (dy === 1) ys.reverse();
    const before = snapshot();
    const mergedInto = new Set();
    const toRemove = [], toPop = [];
    let moved = false, gained = 0;

    for (const y of ys) for (const x of xs) {
      const t = grid[y][x]; if (!t) continue;
      let cx = x, cy = y;
      while (true) {
        const nx = cx + dx, ny = cy + dy;
        if (nx < 0 || ny < 0 || nx >= N || ny >= N || grid[ny][nx]) break;
        cx = nx; cy = ny;
      }
      const nx = cx + dx, ny = cy + dy;
      const other = nx >= 0 && ny >= 0 && nx < N && ny < N ? grid[ny][nx] : null;
      grid[y][x] = null;
      if (other && other.value === t.value && !mergedInto.has(other.id)) {
        // slide into the neighbour, then both are replaced by one doubled tile
        t.x = nx; t.y = ny; paint(t);
        const v = t.value * 2;
        toRemove.push(t, other);
        toPop.push([v, nx, ny]);
        const placeholder = { id: -toPop.length, value: v };   // can't merge again this move
        grid[ny][nx] = placeholder;
        mergedInto.add(placeholder.id);
        gained += v;
        moved = true;
      } else {
        grid[cy][cx] = t;
        if (cx !== x || cy !== y) { t.x = cx; t.y = cy; paint(t); moved = true; }
      }
    }
    if (!moved) return;
    undoState = before;
    busy = true;
    // replace merge placeholders with real tiles (pop animation is delayed until the slide ends)
    for (const [v, x, y] of toPop) {
      grid[y][x] = makeTile(v, x, y, "merged");
      if (v === 2048 && !won) won = true;
    }
    setTimeout(() => { toRemove.forEach(t => t.el.remove()); busy = false; }, 110);
    score += gained;
    updateScore(gained);
    if (gained && navigator.vibrate) navigator.vibrate(8);
    addRandom();
    if (won && !keepPlaying && toPop.some(([v]) => v === 2048)) $("win").hidden = false;
    else if (!movesAvailable()) { over = true; $("lose").hidden = false; }
    save();
  }

  function movesAvailable() {
    if (empty().length) return true;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const v = grid[y][x].value;
      if ((x < N - 1 && grid[y][x + 1].value === v) || (y < N - 1 && grid[y + 1][x].value === v)) return true;
    }
    return false;
  }

  function undo() {
    if (!undoState || busy) return;
    const s = undoState; undoState = null;
    load(s.cells, s.score, s.won, s.keepPlaying);
    save();
  }

  // ---------- input ----------
  const KEYS = { ArrowUp: "up", ArrowRight: "right", ArrowDown: "down", ArrowLeft: "left", KeyW: "up", KeyD: "right", KeyS: "down", KeyA: "left", KeyK: "up", KeyL: "right", KeyJ: "down", KeyH: "left" };
  window.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) { if ((e.metaKey || e.ctrlKey) && e.code === "KeyZ") { e.preventDefault(); undo(); } return; }
    const d = KEYS[e.code];
    if (d) { e.preventDefault(); move(d); }
    else if (e.code === "KeyR") newGame();
    else if (e.code === "KeyU" || e.code === "Backspace") undo();
  });

  let sx = 0, sy = 0, sid = null;
  document.addEventListener("pointerdown", e => {
    if (e.target.closest("button, a")) return;
    sx = e.clientX; sy = e.clientY; sid = e.pointerId;
  });
  document.addEventListener("pointerup", e => {
    if (e.pointerId !== sid) return;
    sid = null;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });
  document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });

  $("newBtn").onclick = newGame;
  $("undoBtn").onclick = undo;
  document.querySelectorAll(".again").forEach(b => b.onclick = newGame);
  $("keepBtn").onclick = () => { keepPlaying = true; $("win").hidden = true; save(); };

  // resume a saved game, otherwise start fresh
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("g2048.state") || "null"); } catch {}
  if (saved && Array.isArray(saved.cells) && saved.cells.length === N) { load(saved.cells, saved.score, saved.won, saved.keepPlaying); save(); }
  else newGame();
})();
</script>
</body>
</html>
