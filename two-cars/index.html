<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#232a63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Two Cars</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #161b45;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff; user-select: none; -webkit-user-select: none;
    touch-action: none; overscroll-behavior: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; justify-content: center; }
  #game { position: relative; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute; top: calc(env(safe-area-inset-top) + 14px); right: 18px;
    font-size: 44px; font-weight: 800; text-shadow: 0 2px 0 rgba(0,0,0,.25);
    pointer-events: none; font-variant-numeric: tabular-nums;
  }
  #pauseBtn {
    position: absolute; top: calc(env(safe-area-inset-top) + 18px); left: 14px;
    width: 40px; height: 40px; border: 0; border-radius: 10px;
    background: rgba(255,255,255,.12); color: #fff; font-size: 18px; display: none;
  }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    background: rgba(22, 27, 69, .78); backdrop-filter: blur(3px);
    transition: opacity .25s; padding: 24px;
  }
  .hidden { opacity: 0; pointer-events: none; }
  h1 { margin: 0; font-size: 54px; letter-spacing: 1px; line-height: 1; }
  h1 .r { color: #f2385a; } h1 .b { color: #36c3d9; }
  h2 { margin: 0; font-size: 26px; opacity: .85; font-weight: 600; }
  .big { font-size: 84px; font-weight: 900; line-height: 1; }
  .sub { opacity: .75; font-size: 16px; line-height: 1.5; max-width: 300px; }
  .legend { display: flex; gap: 22px; justify-content: center; margin: 6px 0; font-size: 15px; }
  .legend span { display: flex; align-items: center; gap: 8px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; border: 4px solid #f2385a; }
  .sq { width: 18px; height: 18px; border-radius: 4px; background: #36c3d9; }
  button.play {
    margin-top: 8px; border: 0; border-radius: 999px; padding: 16px 44px;
    font-size: 22px; font-weight: 800; color: #232a63; background: #fff;
    box-shadow: 0 6px 0 rgba(0,0,0,.25); cursor: pointer;
  }
  button.play:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .row { display: flex; gap: 10px; }
  button.ghost {
    border: 2px solid rgba(255,255,255,.35); background: none; color: #fff;
    border-radius: 999px; padding: 8px 18px; font-size: 14px; cursor: pointer;
  }
  .newbest { color: #ffd166; font-weight: 800; font-size: 18px; }
  .homeLink {
    position: absolute; top: calc(env(safe-area-inset-top) + 10px); left: 10px; z-index: 20;
    padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.38); color: #fff !important;
    font: 700 13px system-ui, -apple-system, "Segoe UI", sans-serif; text-decoration: none; letter-spacing: .2px;
    -webkit-tap-highlight-color: transparent;
  }
  .homeLink:active { transform: scale(.96); }
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <canvas id="c"></canvas>
    <div id="hud">0</div>
    <button id="pauseBtn" aria-label="Pause">❚❚</button>

    <div id="menu" class="overlay">
      <a class="homeLink" href="../">← All games</a>
      <h1><span class="r">TWO</span> <span class="b">CARS</span></h1>
      <div class="sub">Control both cars at once.<br>Tap the <b>left</b> half to steer the red car,<br>the <b>right</b> half to steer the blue one.</div>
      <div class="legend">
        <span><i class="dot"></i> collect every circle</span>
        <span><i class="sq"></i> dodge squares</span>
      </div>
      <div class="sub" id="bestMenu"></div>
      <button class="play" id="playBtn">PLAY</button>
      <div class="sub" style="font-size:13px">Keyboard: ← / → (or A / L)</div>
    </div>

    <div id="paused" class="overlay hidden">
      <h2>Paused</h2>
      <button class="play" id="resumeBtn">RESUME</button>
    </div>

    <div id="over" class="overlay hidden">
      <a class="homeLink" href="../">← All games</a>
      <h2 id="reason">Game over</h2>
      <div class="big" id="finalScore">0</div>
      <div class="newbest" id="newBest" style="display:none">★ NEW BEST ★</div>
      <div class="sub" id="bestOver"></div>
      <button class="play" id="againBtn">PLAY AGAIN</button>
      <div class="row"><button class="ghost" id="menuBtn">Menu</button><button class="ghost" id="soundBtn">Sound: on</button></div>
    </div>
  </div>
</div>

<script>
(() => {
  const RED = "#f2385a", BLUE = "#36c3d9";
  const BG = "#232a63", LANE = "rgba(255,255,255,.10)", DIVIDER = "#8f96d6";

  const $ = id => document.getElementById(id);
  const canvas = $("c"), ctx = canvas.getContext("2d");
  const gameEl = $("game"), hud = $("hud");

  let W = 0, H = 0, DPR = 1, laneW = 0, carW = 0, carH = 0, objS = 0, carY = 0;

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    W = Math.min(vw, Math.round(vh * 0.62));
    H = vh;
    gameEl.style.width = W + "px";
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    laneW = W / 4;
    carW = laneW * 0.44;
    carH = carW * 1.7;
    objS = laneW * 0.42;
    carY = H - carH * 1.6;
  }
  window.addEventListener("resize", resize);
  resize();

  const laneX = l => laneW * l + laneW / 2;

  // ---------- audio (tiny synth, no assets) ----------
  let actx = null, soundOn = localStorage.getItem("twocars.sound") !== "off";
  function beep(freq, dur, type = "sine", vol = 0.08, slide = 0) {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
    } catch {}
  }
  const sfx = {
    collect: side => beep(side ? 880 : 660, 0.12, "triangle", 0.09, 300),
    swap: () => beep(220, 0.05, "square", 0.025),
    crash: () => { beep(160, 0.5, "sawtooth", 0.12, -120); beep(90, 0.6, "square", 0.08, -50); },
  };
  $("soundBtn").textContent = "Sound: " + (soundOn ? "on" : "off");
  $("soundBtn").onclick = e => {
    e.stopPropagation(); soundOn = !soundOn;
    localStorage.setItem("twocars.sound", soundOn ? "on" : "off");
    $("soundBtn").textContent = "Sound: " + (soundOn ? "on" : "off");
  };

  // ---------- state ----------
  let state = "menu"; // menu | play | paused | dying | over
  let cars, objs, particles, score, best = +localStorage.getItem("twocars.best") || 0;
  let speed, dist, scroll, nextSpawn, dyingT, culprit, shake;

  function reset() {
    cars = [
      { lane: 0, x: laneX(0), tilt: 0, color: RED, side: 0 },
      { lane: 3, x: laneX(3), tilt: 0, color: BLUE, side: 1 },
    ];
    objs = []; particles = []; score = 0; scroll = 0; dist = 0; shake = 0;
    speed = H * 0.42;
    // distance (px travelled) at which each side spawns next; staggered
    nextSpawn = [H * 0.35, H * 0.75];
    culprit = null;
    hud.textContent = "0";
  }

  function spawn(side) {
    const lane = side * 2 + (Math.random() < 0.5 ? 0 : 1);
    const type = Math.random() < 0.5 ? "circle" : "square";
    objs.push({ side, lane, x: laneX(lane), y: -objS, type, color: side ? BLUE : RED, done: false });
  }

  function gapFor() {
    // vertical spacing between objects on one side; shrinks slightly with speed
    // but always leaves enough room for a lane swap
    const min = carH * 2.4;
    const base = H * 0.42 - score * 0.6;
    return Math.max(min, base) * (0.85 + Math.random() * 0.5);
  }

  function steer(side) {
    if (state !== "play") return;
    const c = cars[side];
    c.lane = side * 2 + (c.lane % 2 === 0 ? 1 : 0);
    sfx.swap();
  }

  function burst(x, y, color, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 220;
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, color, r: 2 + Math.random() * 3 });
    }
  }

  function die(obj, reason) {
    state = "dying"; dyingT = 0; culprit = obj; shake = 14;
    $("reason").textContent = reason;
    sfx.crash();
    if (navigator.vibrate) navigator.vibrate([60, 40, 120]);
  }

  // ---------- update ----------
  function update(dt) {
    if (state === "dying") {
      dyingT += dt;
      shake *= 0.9;
      updateParticles(dt);
      if (dyingT > 1.1) showOver();
      return;
    }
    if (state !== "play") return;

    speed = Math.min(H * 1.25, H * 0.42 + score * H * 0.007);
    const dy = speed * dt;
    scroll = (scroll + dy) % (H / 8);
    dist += dy;

    for (let s = 0; s < 2; s++) {
      if (dist >= nextSpawn[s]) { spawn(s); nextSpawn[s] = dist + gapFor(); }
    }

    for (const c of cars) {
      const tx = laneX(c.lane);
      const k = 1 - Math.pow(1e-9, dt); // fast ease
      const prev = c.x;
      c.x += (tx - c.x) * k;
      if (Math.abs(tx - c.x) < 0.5) c.x = tx;
      c.tilt = Math.max(-0.35, Math.min(0.35, (c.x - prev) / Math.max(dt, 1e-3) / (laneW * 14)));
    }

    const hitW = carW * 0.5, hitH = carH * 0.5;
    for (const o of objs) {
      o.y += dy;
      if (o.done) continue;
      const c = cars[o.side];
      const r = objS * 0.42;
      const overlapX = Math.abs(o.x - c.x) < hitW + r;
      const overlapY = Math.abs(o.y - carY) < hitH + r;
      if (overlapX && overlapY) {
        if (o.type === "circle") {
          o.done = true; o.collected = true; score++;
          hud.textContent = score;
          burst(o.x, o.y, o.color);
          sfx.collect(o.side);
        } else {
          burst(c.x, carY, c.color, 26);
          return die(o, "Crashed into a square");
        }
      } else if (o.type === "circle" && o.y - r > carY + hitH) {
        return die(o, "Missed a circle");
      } else if (o.type === "square" && o.y - r > carY + hitH) {
        o.done = true;
      }
    }
    objs = objs.filter(o => o.y < H + objS && !o.collected);
    updateParticles(dt);
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt * 1.8;
    }
    particles = particles.filter(p => p.life > 0);
  }

  // ---------- draw ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) return ctx.roundRect(x, y, w, h, r);
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawRoad() {
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    // dashed lane lines
    const dash = H / 16;
    ctx.strokeStyle = LANE; ctx.lineWidth = 2;
    ctx.setLineDash([dash, dash]);
    ctx.lineDashOffset = -scroll * 2;
    for (const l of [1, 3]) {
      ctx.beginPath(); ctx.moveTo(laneW * l, 0); ctx.lineTo(laneW * l, H); ctx.stroke();
    }
    ctx.setLineDash([]);
    // center divider
    ctx.strokeStyle = DIVIDER; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
  }

  function drawCar(c) {
    ctx.save();
    ctx.translate(c.x, carY);
    ctx.rotate(c.tilt);
    const w = carW, h = carH;
    // shadow
    ctx.fillStyle = "rgba(0,0,0,.22)";
    rr(-w / 2 + 3, -h / 2 + 6, w, h, w * 0.3); ctx.fill();
    // body
    ctx.fillStyle = c.color;
    rr(-w / 2, -h / 2, w, h, w * 0.3); ctx.fill();
    // windshield + rear window
    ctx.fillStyle = BG;
    rr(-w * 0.36, -h * 0.2, w * 0.72, h * 0.2, w * 0.1); ctx.fill();
    ctx.globalAlpha = 0.7;
    rr(-w * 0.32, h * 0.22, w * 0.64, h * 0.12, w * 0.08); ctx.fill();
    ctx.globalAlpha = 1;
    // headlights
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.beginPath(); ctx.arc(-w * 0.27, -h * 0.42, w * 0.08, 0, 7); ctx.arc(w * 0.27, -h * 0.42, w * 0.08, 0, 7); ctx.fill();
    ctx.restore();
  }

  function drawObj(o, t) {
    if (o === culprit && state === "dying" && Math.floor(dyingT * 8) % 2) return;
    const s = objS;
    ctx.save();
    ctx.translate(o.x, o.y);
    if (o.type === "circle") {
      ctx.strokeStyle = o.color; ctx.lineWidth = s * 0.18;
      ctx.beginPath(); ctx.arc(0, 0, s * 0.41, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = o.color;
      ctx.beginPath(); ctx.arc(0, 0, s * 0.14, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = o.color;
      rr(-s / 2, -s / 2, s, s, s * 0.16); ctx.fill();
      ctx.strokeStyle = BG; ctx.lineWidth = s * 0.1;
      rr(-s * 0.24, -s * 0.24, s * 0.48, s * 0.48, s * 0.06); ctx.stroke();
    }
    ctx.restore();
  }

  function draw(t) {
    ctx.save();
    if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawRoad();
    if (cars) {
      for (const o of objs) drawObj(o, t);
      for (const c of cars) drawCar(c);
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw(now);
    requestAnimationFrame(frame);
  }

  // ---------- screens ----------
  const show = (el, on) => $(el).classList.toggle("hidden", !on);

  function start() {
    reset();
    state = "play";
    show("menu", false); show("over", false); show("paused", false);
    $("pauseBtn").style.display = "block";
    hud.style.display = "block";
    if (actx && actx.state === "suspended") actx.resume();
  }

  function showOver() {
    state = "over";
    const isBest = score > best;
    if (isBest) { best = score; localStorage.setItem("twocars.best", best); }
    $("finalScore").textContent = score;
    $("newBest").style.display = isBest && score > 0 ? "block" : "none";
    $("bestOver").textContent = "Best: " + best;
    $("pauseBtn").style.display = "none";
    show("over", true);
  }

  function showMenu() {
    state = "menu";
    $("bestMenu").textContent = best ? "Best: " + best : "";
    show("over", false); show("menu", true);
    $("pauseBtn").style.display = "none";
    hud.style.display = "none";
  }

  function pause() {
    if (state !== "play") return;
    state = "paused"; show("paused", true);
  }
  function resume() {
    if (state !== "paused") return;
    state = "play"; show("paused", false); last = performance.now();
  }

  $("playBtn").onclick = start;
  $("againBtn").onclick = start;
  $("menuBtn").onclick = e => { e.stopPropagation(); showMenu(); };
  $("pauseBtn").addEventListener("pointerdown", e => { e.stopPropagation(); pause(); });
  $("resumeBtn").onclick = resume;
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

  // ---------- input ----------
  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    steer(e.clientX - rect.left < rect.width / 2 ? 0 : 1);
  });
  // allow tapping anywhere in the left/right black margins on wide screens too
  document.getElementById("wrap").addEventListener("pointerdown", e => {
    if (e.target !== e.currentTarget) return;
    steer(e.clientX < window.innerWidth / 2 ? 0 : 1);
  });
  window.addEventListener("keydown", e => {
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (["arrowleft", "a", "f", "z"].includes(k)) steer(0);
    else if (["arrowright", "l", "j", "m"].includes(k)) steer(1);
    else if (k === " " || k === "enter") {
      if (state === "menu" || state === "over") start();
      else if (state === "paused") resume();
    } else if (k === "p" || k === "escape") state === "paused" ? resume() : pause();
  });

  reset();
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
