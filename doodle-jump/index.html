<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Doodle Jump</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #e9dfc6;
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", "Comic Neue", cursive, sans-serif;
    color: #3b3b1f; user-select: none; -webkit-user-select: none;
    touch-action: none; overscroll-behavior: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; justify-content: center; }
  #game { position: relative; height: 100%; box-shadow: 0 0 30px rgba(0,0,0,.15); }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; height: calc(env(safe-area-inset-top) + 52px);
    padding: calc(env(safe-area-inset-top) + 8px) 14px 0; display: none;
    background: rgba(247, 241, 225, .82); border-bottom: 2px solid rgba(59,59,31,.25);
    font-size: 28px; font-weight: 700; pointer-events: none;
  }
  #pauseBtn {
    position: absolute; top: calc(env(safe-area-inset-top) + 7px); right: 10px;
    width: 38px; height: 38px; border: 2.5px solid #3b3b1f; border-radius: 10px;
    background: #fff8e6; color: #3b3b1f; font-size: 15px; font-weight: 900; display: none;
  }
  #shootBtn {
    position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px);
    transform: translateX(-50%); width: 64px; height: 64px; border-radius: 50%;
    border: 3px solid rgba(59,59,31,.55); background: rgba(255,248,230,.6);
    font-size: 26px; display: none;
  }
  #shootBtn:active { background: rgba(255,248,230,.95); }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; text-align: center;
    background: rgba(247, 241, 225, .86); transition: opacity .25s; padding: 24px;
  }
  .hidden { opacity: 0; pointer-events: none; }
  h1 { margin: 0; font-size: 56px; line-height: .95; color: #c4442d; transform: rotate(-4deg);
       text-shadow: 3px 3px 0 #3b3b1f; -webkit-text-stroke: 1.5px #3b3b1f; }
  h2 { margin: 0; font-size: 34px; }
  .big { font-size: 72px; font-weight: 900; line-height: 1; }
  .sub { font-size: 17px; line-height: 1.45; max-width: 300px; opacity: .85; }
  button.play {
    margin-top: 6px; border: 3px solid #3b3b1f; border-radius: 16px; padding: 12px 40px;
    font: inherit; font-size: 26px; font-weight: 900; color: #3b3b1f; background: #b9e06a;
    box-shadow: 4px 4px 0 #3b3b1f; cursor: pointer;
  }
  button.play:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #3b3b1f; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button.ghost {
    border: 2.5px solid #3b3b1f; background: #fff8e6; color: #3b3b1f; font: inherit;
    border-radius: 12px; padding: 7px 14px; font-size: 15px; cursor: pointer;
  }
  .newbest { color: #c4442d; font-weight: 900; font-size: 20px; }
  .legend { font-size: 15px; line-height: 1.7; text-align: left; }
  .sw { display: inline-block; width: 26px; height: 9px; border-radius: 5px; border: 2px solid #3b3b1f; vertical-align: middle; margin-right: 6px; }
  .homeLink {
    position: absolute; top: calc(env(safe-area-inset-top) + 10px); left: 10px; z-index: 20;
    padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.38); color: #fff !important;
    font: 700 13px system-ui, -apple-system, "Segoe UI", sans-serif; text-decoration: none; letter-spacing: .2px;
    -webkit-tap-highlight-color: transparent;
  }
  .homeLink:active { transform: scale(.96); }
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <canvas id="c"></canvas>
    <div id="hud"><span id="score">0</span></div>
    <button id="pauseBtn" aria-label="Pause">❚❚</button>
    <button id="shootBtn" aria-label="Shoot">💥</button>

    <div id="menu" class="overlay">
      <a class="homeLink" href="../">← All games</a>
      <h1>doodle<br>jump</h1>
      <div class="sub" id="howto"></div>
      <div class="legend">
        <div><span class="sw" style="background:#7cc242"></span>normal</div>
        <div><span class="sw" style="background:#4aa3df"></span>moving</div>
        <div><span class="sw" style="background:#b07a43"></span>breaks, won't hold you</div>
        <div><span class="sw" style="background:#fff"></span>vanishes after one jump</div>
        <div>🌀 spring &nbsp;🚁 propeller hat &nbsp;👾 stomp or shoot</div>
      </div>
      <div class="sub" id="bestMenu"></div>
      <button class="play" id="playBtn">play</button>
      <div class="row"><button class="ghost" id="ctrlBtn"></button><button class="ghost sound">sound: on</button></div>
    </div>

    <div id="paused" class="overlay hidden">
      <h2>paused</h2>
      <button class="play" id="resumeBtn">resume</button>
      <button class="ghost" id="quitBtn">menu</button>
    </div>

    <div id="over" class="overlay hidden">
      <a class="homeLink" href="../">← All games</a>
      <h2>game over!</h2>
      <div class="sub" id="reason"></div>
      <div class="big" id="finalScore">0</div>
      <div class="newbest" id="newBest" style="display:none">★ new high score ★</div>
      <div class="sub" id="bestOver"></div>
      <button class="play" id="againBtn">play again</button>
      <div class="row"><button class="ghost" id="menuBtn">menu</button><button class="ghost sound">sound: on</button></div>
    </div>
  </div>
</div>

<script>
(() => {
  // ---------- world constants (world units; width is always 360) ----------
  const WW = 360;
  const G = 1500, JUMP = 760;              // jump apex ≈ JUMP²/2G ≈ 192
  const SPRING = JUMP * 1.6, FLY_V = 820, FLY_T = 2.8;
  const MAXV = 340, PW = 60, PH = 14;
  const PLAT = { normal: "#7cc242", moving: "#4aa3df", break: "#b07a43", vanish: "#ffffff" };
  const INK = "#3b3b1f";

  const $ = id => document.getElementById(id);
  const canvas = $("c"), ctx = canvas.getContext("2d");
  let W, H, S, VH, DPR;                    // css size, world scale, view height (world units)

  function resize() {
    W = Math.min(window.innerWidth, Math.round(window.innerHeight * 0.62));
    H = window.innerHeight;
    $("game").style.width = W + "px";
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = W * DPR; canvas.height = H * DPR;
    S = W / WW; VH = H / S;
  }
  window.addEventListener("resize", resize);
  resize();

  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- audio ----------
  let actx = null, soundOn = localStorage.getItem("dj.sound") !== "off";
  function tone(freq, dur, type = "sine", vol = 0.08, to = 0, delay = 0) {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch {}
  }
  const sfx = {
    jump: () => tone(300, 0.14, "sine", 0.09, 620),
    spring: () => { tone(250, 0.35, "triangle", 0.1, 1200); },
    crack: () => { tone(180, 0.12, "square", 0.05, 60); tone(120, 0.1, "sawtooth", 0.04, 50, 0.04); },
    shoot: () => tone(900, 0.07, "square", 0.035, 1500),
    pop: () => { tone(500, 0.1, "square", 0.05, 120); tone(800, 0.15, "triangle", 0.06, 200, 0.05); },
    prop: () => tone(150, FLY_T, "sawtooth", 0.025, 160),
    hit: () => tone(400, 0.25, "square", 0.08, 80),
    fall: () => tone(700, 1.0, "sine", 0.09, 90),
  };
  function syncSound() { document.querySelectorAll(".sound").forEach(b => b.textContent = "sound: " + (soundOn ? "on" : "off")); }
  document.querySelectorAll(".sound").forEach(b => b.onclick = () => {
    soundOn = !soundOn; localStorage.setItem("dj.sound", soundOn ? "on" : "off"); syncSound();
  });
  syncSound();

  // ---------- controls mode ----------
  const hasTilt = "DeviceOrientationEvent" in window && matchMedia("(pointer: coarse)").matches;
  let ctrl = localStorage.getItem("dj.ctrl") || "touch"; // touch | tilt
  if (!hasTilt) ctrl = "touch";
  let tiltGamma = 0;
  window.addEventListener("deviceorientation", e => { if (e.gamma != null) tiltGamma = e.gamma; });
  async function askTilt() {
    const D = window.DeviceOrientationEvent;
    if (D && typeof D.requestPermission === "function") {
      try { return (await D.requestPermission()) === "granted"; } catch { return false; }
    }
    return true;
  }
  function syncCtrl() {
    $("ctrlBtn").style.display = hasTilt ? "" : "none";
    $("ctrlBtn").textContent = "controls: " + ctrl;
    $("howto").innerHTML = !matchMedia("(pointer: coarse)").matches
      ? "← → / A D to move<br>space or ↑ to shoot"
      : ctrl === "tilt" ? "Tilt your phone to move.<br>Tap anywhere to shoot."
                        : "Hold the <b>left</b> or <b>right</b> side to move.<br>Tap 💥 to shoot.";
  }
  $("ctrlBtn").onclick = async () => {
    if (ctrl === "touch") { if (await askTilt()) ctrl = "tilt"; } else ctrl = "touch";
    localStorage.setItem("dj.ctrl", ctrl); syncCtrl();
  };
  syncCtrl();

  // ---------- state ----------
  let state = "menu";       // menu | play | paused | falling | over
  let P, plats, monsters, bullets, pieces, particles;
  let camY, topY, maxClimb, best = +localStorage.getItem("dj.best") || 0, fallT, deathReason;
  const climb = y => -y;    // world y grows downward; start platform is at y=0
  const scoreOf = c => Math.floor(Math.max(0, c) / 3);

  function reset() {
    P = { x: WW / 2, y: -40, vx: 0, vy: -JUMP, face: 1, shootT: 0, flyT: 0, spin: 0, squish: 0, dead: false };
    plats = [{ x: WW / 2 - PW / 2, y: 0, w: PW, h: PH, type: "normal", vx: 0 }];
    monsters = []; bullets = []; pieces = []; particles = [];
    camY = -VH * 0.72; topY = 0; maxClimb = 0; fallT = 0;
    generate();
    $("score").textContent = "0";
  }

  function difficulty(y) { return clamp(climb(y) / 18000, 0, 1); }

  function makePlat(type, y, d) {
    const p = { x: rand(0, WW - PW), y, w: PW, h: PH, type, vx: 0 };
    if (type === "moving") p.vx = (Math.random() < 0.5 ? -1 : 1) * lerp(55, 140, d);
    return p;
  }

  function generate() {
    while (topY > camY - 120) {
      const d = difficulty(topY);
      const gap = lerp(46, 150, d) * rand(0.72, 1);
      // decoy breakable platform somewhere in the gap (never the only way up)
      if (gap > 60 && Math.random() < lerp(0.08, 0.32, d)) {
        plats.push(makePlat("break", topY - gap * rand(0.3, 0.7), d));
      }
      topY -= gap;
      const r = Math.random();
      const pMove = climb(topY) > 600 ? lerp(0.08, 0.38, d) : 0, pVanish = climb(topY) > 1800 ? lerp(0.04, 0.16, d) : 0;
      const type = r < pMove ? "moving" : r < pMove + pVanish ? "vanish" : "normal";
      const p = makePlat(type, topY, d);
      if (type !== "vanish" && climb(topY) > 300) {
        const q = Math.random();
        if (q < 0.065) p.spring = { ox: rand(8, PW - 26), t: 0 };
        else if (q < 0.078 && climb(topY) > 1500) p.prop = { ox: rand(10, PW - 30) };
      }
      plats.push(p);
      if (climb(topY) > 1800 && Math.random() < lerp(0.025, 0.07, d)) {
        monsters.push({ x: rand(30, WW - 30), y: topY - gap * 0.5 - 30, t: rand(0, 6), vx: Math.random() < 0.4 ? rand(40, 90) : 0, dead: false, vy: 0 });
      }
    }
    const cut = camY + VH + 80;
    plats = plats.filter(p => p.y < cut && !p.gone);
    monsters = monsters.filter(m => m.y < cut);
  }

  // ---------- input ----------
  const keys = { left: false, right: false };
  const touches = new Map(); // pointerId -> -1 | 1
  function inputDir() {
    let d = 0;
    if (keys.left) d -= 1;
    if (keys.right) d += 1;
    if (ctrl === "touch" && touches.size) d = [...touches.values()].pop();
    return d;
  }

  function shoot() {
    if (state !== "play" || P.flyT > 0 || P.shootT > 0.08) return;
    P.shootT = 0.25;
    bullets.push({ x: P.x, y: P.y - 34 });
    sfx.shoot();
  }

  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (state !== "play") return;
    if (ctrl === "tilt" || e.pointerType === "mouse") return shoot();
    const r = canvas.getBoundingClientRect();
    touches.set(e.pointerId, e.clientX - r.left < r.width / 2 ? -1 : 1);
  });
  canvas.addEventListener("pointermove", e => {
    if (!touches.has(e.pointerId)) return;
    const r = canvas.getBoundingClientRect();
    touches.set(e.pointerId, e.clientX - r.left < r.width / 2 ? -1 : 1);
  });
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) {
    canvas.addEventListener(ev, e => touches.delete(e.pointerId));
  }
  $("shootBtn").addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); shoot(); });

  window.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "a") keys.left = true;
    else if (k === "arrowright" || k === "d") keys.right = true;
    else if (k === " " || k === "arrowup" || k === "w") {
      e.preventDefault();
      if (state === "play") shoot();
      else if (state === "menu" || state === "over") { if (!e.repeat) start(); }
      else if (state === "paused") resume();
    } else if (k === "p" || k === "escape") state === "paused" ? resume() : pause();
  });
  window.addEventListener("keyup", e => {
    const k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "a") keys.left = false;
    if (k === "arrowright" || k === "d") keys.right = false;
  });

  // ---------- update ----------
  function burst(x, y, color, n = 10, spd = 160) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), v = rand(30, spd);
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 1, color, r: rand(2, 4.5) });
    }
  }

  function killPlayer(reason) {
    if (P.dead) return;
    P.dead = true; P.vy = Math.max(P.vy, 0); P.vx *= 0.3; deathReason = reason;
    sfx.hit();
    if (navigator.vibrate) navigator.vibrate(120);
  }

  function update(dt) {
    if (state !== "play" && state !== "falling") return;

    // horizontal movement
    if (!P.dead) {
      let target;
      if (ctrl === "tilt" && !keys.left && !keys.right) {
        const portrait = !screen.orientation || screen.orientation.type.startsWith("portrait");
        target = portrait ? clamp(tiltGamma / 22, -1, 1) * MAXV * 1.15 : 0;
      } else target = inputDir() * MAXV;
      P.vx += (target - P.vx) * (1 - Math.pow(0.0005, dt));
      if (Math.abs(P.vx) > 20) P.face = P.vx > 0 ? 1 : -1;
    }
    P.x += P.vx * dt;
    if (P.x < -22) P.x += WW + 44;
    if (P.x > WW + 22) P.x -= WW + 44;

    // vertical
    const prevFeet = P.y + 22;
    if (P.flyT > 0) {
      P.flyT -= dt; P.vy = -FLY_V;
      if (P.flyT <= 0) P.vy = -JUMP * 0.6;
    } else P.vy += G * dt;
    P.y += P.vy * dt;
    const feet = P.y + 22;
    P.shootT = Math.max(0, P.shootT - dt);
    P.squish = Math.max(0, P.squish - dt * 5);
    if (P.spin > 0) P.spin = Math.max(0, P.spin - dt * 1.6);

    // platforms
    for (const p of plats) {
      if (p.type === "moving") {
        p.x += p.vx * dt;
        if (p.x < 0) { p.x = 0; p.vx *= -1; }
        if (p.x + p.w > WW) { p.x = WW - p.w; p.vx *= -1; }
      }
      if (p.spring && p.spring.t > 0) p.spring.t -= dt;
      if (p.fade != null) { p.fade -= dt * 3; if (p.fade <= 0) p.gone = true; }

      // pick up propeller hat
      if (p.prop && !P.dead) {
        const hx = p.x + p.prop.ox + 10, hy = p.y - 12;
        if (Math.abs(P.x - hx) < 28 && Math.abs(P.y - hy) < 34) {
          p.prop = null; P.flyT = FLY_T; P.spin = 0; sfx.prop();
        }
      }

      if (P.dead || state === "falling" || P.flyT > 0 || P.vy <= 0 || p.broken || p.fade != null) continue;
      if (prevFeet <= p.y + 2 && feet >= p.y && P.x + 16 > p.x && P.x - 16 < p.x + p.w) {
        if (p.type === "break") {
          p.broken = true; sfx.crack();
          pieces.push({ x: p.x, y: p.y, w: p.w / 2, vy: 0, rot: 0, vr: -2.5 }, { x: p.x + p.w / 2, y: p.y, w: p.w / 2, vy: 0, rot: 0, vr: 2.5 });
          continue;
        }
        P.y = p.y - 22;
        if (p.spring && P.x > p.x + p.spring.ox - 8 && P.x < p.x + p.spring.ox + 26) {
          P.vy = -SPRING; p.spring.t = 0.25; P.spin = 1; sfx.spring();
        } else {
          P.vy = -JUMP; P.squish = 1; sfx.jump();
        }
        if (p.type === "vanish") { p.fade = 1; burst(p.x + p.w / 2, p.y, "#ffffff", 8, 90); }
      }
    }
    plats = plats.filter(p => !p.broken);

    for (const pc of pieces) { pc.vy += G * dt; pc.y += pc.vy * dt; pc.rot += pc.vr * dt; }
    pieces = pieces.filter(pc => pc.y < camY + VH + 100);

    // bullets
    for (const b of bullets) b.y -= 1000 * dt;
    bullets = bullets.filter(b => b.y > camY - 40 && !b.hit);

    // monsters
    for (const m of monsters) {
      m.t += dt;
      if (m.dead) { m.vy += G * dt; m.y += m.vy * dt; continue; }
      if (m.vx) { m.x += m.vx * dt; if (m.x < 30 || m.x > WW - 30) m.vx *= -1; }
      const my = m.y + Math.sin(m.t * 3) * 6;
      for (const b of bullets) {
        if (Math.abs(b.x - m.x) < 30 && Math.abs(b.y - my) < 26) { b.hit = true; m.dead = true; sfx.pop(); burst(m.x, my, "#8a57c9", 14); }
      }
      if (m.dead || P.dead) continue;
      if (Math.abs(P.x - m.x) < 40 && Math.abs(P.y - my) < 40) {
        if (P.flyT > 0) { m.dead = true; sfx.pop(); burst(m.x, my, "#8a57c9", 14); }
        else if (P.vy > 0 && prevFeet <= my - 8) {
          m.dead = true; P.vy = -JUMP; sfx.pop(); burst(m.x, my, "#8a57c9", 14);
        } else killPlayer("bumped into a monster");
      }
    }

    // particles
    for (const pt of particles) { pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 400 * dt; pt.life -= dt * 1.6; }
    particles = particles.filter(pt => pt.life > 0);

    // camera + score
    if (state === "play") {
      const target = P.y - VH * 0.42;
      if (target < camY) camY = target;
      maxClimb = Math.max(maxClimb, climb(P.y) - 40);
      $("score").textContent = scoreOf(maxClimb);
      generate();
      if (P.y - 30 > camY + VH) {
        state = "falling"; fallT = 0; sfx.fall();
        if (!deathReason) deathReason = "fell off the page";
        touches.clear();
      }
    } else {
      fallT += dt;
      camY += (P.y - VH * 0.5 - camY) * Math.min(1, dt * 6);
      if (fallT > 1.2) showOver();
    }
  }

  // ---------- draw ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) return ctx.roundRect(x, y, w, h, r);
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawPaper() {
    ctx.fillStyle = "#f7f1e1"; ctx.fillRect(0, 0, WW, VH);
    ctx.strokeStyle = "#eadfc3"; ctx.lineWidth = 1;
    const g = 20, off = ((-camY % g) + g) % g;
    ctx.beginPath();
    for (let y = off; y < VH; y += g) { ctx.moveTo(0, y); ctx.lineTo(WW, y); }
    for (let x = 0; x <= WW; x += g) { ctx.moveTo(x, 0); ctx.lineTo(x, VH); }
    ctx.stroke();
  }

  function drawBestLine() {
    if (!best) return;
    const y = -(best * 3) - camY;
    if (y < -10 || y > VH + 10) return;
    ctx.strokeStyle = "#c4442d"; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WW, y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "#c4442d"; ctx.font = "bold 13px 'Comic Sans MS', cursive"; ctx.fillText("best " + best, 6, y - 5);
  }

  function drawPlat(p) {
    const y = p.y - camY;
    ctx.save();
    if (p.fade != null) ctx.globalAlpha = Math.max(0, p.fade);
    ctx.fillStyle = PLAT[p.type]; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    rr(p.x, y, p.w, p.h, 7); ctx.fill(); ctx.stroke();
    if (p.type === "break") {
      ctx.lineWidth = 1.8; ctx.beginPath();
      ctx.moveTo(p.x + p.w / 2 - 3, y + 1); ctx.lineTo(p.x + p.w / 2 + 3, y + 6); ctx.lineTo(p.x + p.w / 2 - 2, y + p.h - 1);
      ctx.stroke();
    } else {
      ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p.x + 8, y + 4); ctx.lineTo(p.x + p.w - 14, y + 4); ctx.stroke();
    }
    ctx.restore();
    if (p.spring) drawSpring(p.x + p.spring.ox, y, p.spring.t > 0);
    if (p.prop) drawHat(p.x + p.prop.ox + 10, y - 10, 0, false);
  }

  function drawSpring(x, y, sprung) {
    const h = sprung ? 26 : 12;
    ctx.strokeStyle = INK; ctx.lineWidth = 2.2;
    ctx.beginPath();
    for (let i = 0; i <= 4; i++) { const yy = y - (h * i) / 4; ctx.moveTo(x + 2, yy); ctx.lineTo(x + 16, yy - h / 8); }
    ctx.stroke();
    ctx.fillStyle = "#cfcfcf"; rr(x - 1, y - h - 5, 20, 5, 2); ctx.fill(); ctx.stroke();
  }

  function drawHat(x, y, t, flying) {
    ctx.save(); ctx.translate(x, y);
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    // blades
    const s = flying ? Math.abs(Math.sin(t * 40)) : 1;
    ctx.fillStyle = "#e05a3a";
    ctx.beginPath(); ctx.ellipse(0, -11, 15 * s + 2, 3, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(0, -4); ctx.stroke();
    // cap
    ctx.fillStyle = "#f2c230";
    ctx.beginPath(); ctx.arc(0, 2, 10, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawDoodler(now) {
    const x = P.x, y = P.y - camY;
    const draw = ox => {
      ctx.save();
      ctx.translate(ox, y);
      if (P.spin > 0) ctx.rotate(P.face * (1 - P.spin) * Math.PI * 2);
      if (P.dead) ctx.rotate(Math.sin(now / 80) * 0.4);
      const sq = P.squish * 0.12;
      ctx.scale(1 + sq, 1 - sq);
      const shooting = P.shootT > 0;
      if (!shooting) ctx.scale(P.face, 1);
      ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.lineCap = "round";

      // legs
      const kick = P.vy < 0 ? 3 : 0;
      ctx.beginPath();
      for (const lx of [-11, -4, 4, 11]) { ctx.moveTo(lx, 15); ctx.lineTo(lx + (lx < 0 ? -1 : 1), 22 - kick); }
      ctx.stroke();

      // snout
      ctx.fillStyle = "#d3e35b";
      if (shooting) {
        rr(-6, -38, 12, 22, 3); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(0, -38, 7, 3, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      } else {
        rr(10, -10, 20, 11, 3); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(30, -4.5, 3, 6.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }

      // body
      ctx.beginPath();
      ctx.moveTo(-17, 16); ctx.lineTo(-17, -4);
      ctx.quadraticCurveTo(-17, -22, 0, -22);
      ctx.quadraticCurveTo(17, -22, 17, -4);
      ctx.lineTo(17, 16); ctx.closePath();
      ctx.fill(); ctx.stroke();
      // pants stripes
      ctx.strokeStyle = "#6b8f23"; ctx.lineWidth = 2.5;
      ctx.beginPath(); for (const sy of [6, 11]) { ctx.moveTo(-15.5, sy); ctx.lineTo(15.5, sy); } ctx.stroke();
      ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(-17, 16); ctx.lineTo(17, 16); ctx.stroke();

      // eyes
      ctx.fillStyle = INK;
      if (P.dead) {
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(1, -11); ctx.lineTo(7, -5); ctx.moveTo(7, -11); ctx.lineTo(1, -5); ctx.stroke();
      } else if (shooting) {
        ctx.beginPath(); ctx.arc(-6, -10, 2.6, 0, 7); ctx.arc(6, -10, 2.6, 0, 7); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(5, -9, 2.8, 0, 7); ctx.arc(-3, -9, 2.4, 0, 7); ctx.fill();
      }
      ctx.restore();
      if (P.flyT > 0) drawHat(ox, y - 27, now / 1000, true);
      if (P.dead) {
        // stars circling the head
        for (let i = 0; i < 3; i++) {
          const a = now / 250 + (i * Math.PI * 2) / 3;
          ctx.fillStyle = "#f2c230"; ctx.font = "14px sans-serif";
          ctx.fillText("★", ox + Math.cos(a) * 18 - 5, y - 30 + Math.sin(a) * 5);
        }
      }
    };
    draw(x);
    // draw a ghost copy when wrapping across the edge
    if (x < 24) draw(x + WW + 44);
    if (x > WW - 24) draw(x - WW - 44);
  }

  function drawMonster(m) {
    const y = m.y - camY + (m.dead ? 0 : Math.sin(m.t * 3) * 6);
    ctx.save(); ctx.translate(m.x, y);
    if (m.dead) ctx.rotate(m.t * 4);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    // wings
    const flap = Math.sin(m.t * 18) * 6;
    ctx.fillStyle = "#c9b6ea";
    ctx.beginPath(); ctx.ellipse(-30, -6 + flap, 12, 7, -0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(30, -6 + flap, 12, 7, 0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // body
    ctx.fillStyle = "#8a57c9";
    ctx.beginPath(); ctx.ellipse(0, 0, 26, 20, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // eyes
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(-9, -5, 7, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(9, -5, 7, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(-8, -4, 3, 0, 7); ctx.arc(10, -4, 3, 0, 7); ctx.fill();
    // teeth
    ctx.fillStyle = "#fff"; ctx.beginPath();
    ctx.moveTo(-10, 8); ctx.lineTo(-6, 14); ctx.lineTo(-2, 8); ctx.lineTo(2, 14); ctx.lineTo(6, 8); ctx.lineTo(10, 14); ctx.lineTo(10, 8); ctx.closePath();
    ctx.fill(); ctx.lineWidth = 1.6; ctx.stroke();
    ctx.restore();
  }

  function draw(now) {
    ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
    drawPaper();
    if (!P) return;
    drawBestLine();
    for (const p of plats) drawPlat(p);
    for (const pc of pieces) {
      ctx.save(); ctx.translate(pc.x + pc.w / 2, pc.y - camY + PH / 2); ctx.rotate(pc.rot);
      ctx.fillStyle = PLAT.break; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
      rr(-pc.w / 2, -PH / 2, pc.w, PH, 5); ctx.fill(); ctx.stroke(); ctx.restore();
    }
    for (const m of monsters) drawMonster(m);
    ctx.fillStyle = INK;
    for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y - camY, 4.5, 0, 7); ctx.fill(); }
    for (const pt of particles) {
      ctx.globalAlpha = Math.max(0, pt.life); ctx.fillStyle = pt.color; ctx.strokeStyle = INK; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(pt.x, pt.y - camY, pt.r, 0, 7); ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    drawDoodler(now);
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000);
    last = now;
    // two half-steps keep collisions crisp on slow frames
    update(dt / 2); update(dt / 2);
    if (state === "menu") demo(dt);
    draw(now);
    requestAnimationFrame(frame);
  }

  // a doodler hops in place behind the menu
  function demo(dt) {
    P.vy += G * dt; P.y += P.vy * dt;
    if (P.y + 22 >= 0 && P.vy > 0) { P.y = -22; P.vy = -JUMP * 0.75; P.squish = 1; }
    P.squish = Math.max(0, P.squish - dt * 5);
  }

  // ---------- screens ----------
  const show = (el, on) => $(el).classList.toggle("hidden", !on);

  async function start() {
    if (ctrl === "tilt") await askTilt();
    if (actx && actx.state === "suspended") actx.resume();
    reset();
    deathReason = "";
    state = "play";
    show("menu", false); show("over", false); show("paused", false);
    $("hud").style.display = "block"; $("pauseBtn").style.display = "block";
    $("shootBtn").style.display = ctrl === "touch" && matchMedia("(pointer: coarse)").matches ? "block" : "none";
    last = performance.now();
  }

  function showOver() {
    state = "over";
    const sc = scoreOf(maxClimb), isBest = sc > best;
    if (isBest) { best = sc; localStorage.setItem("dj.best", best); }
    $("finalScore").textContent = sc;
    $("reason").textContent = "You " + deathReason + ".";
    $("newBest").style.display = isBest && sc > 0 ? "block" : "none";
    $("bestOver").textContent = "high score: " + best;
    $("pauseBtn").style.display = "none"; $("shootBtn").style.display = "none";
    show("over", true);
  }

  function showMenu() {
    state = "menu";
    reset();
    P.x = WW / 2; P.y = -22; P.vy = 0;
    plats = [{ x: WW / 2 - PW / 2, y: 0, w: PW, h: PH, type: "normal", vx: 0 }];
    monsters = [];
    camY = -VH * 0.8;
    $("bestMenu").textContent = best ? "high score: " + best : "";
    show("over", false); show("paused", false); show("menu", true);
    $("hud").style.display = "none"; $("pauseBtn").style.display = "none"; $("shootBtn").style.display = "none";
  }

  function pause() {
    if (state !== "play") return;
    state = "paused"; touches.clear(); show("paused", true);
  }
  function resume() {
    if (state !== "paused") return;
    state = "play"; show("paused", false); last = performance.now();
  }

  $("playBtn").onclick = start;
  $("againBtn").onclick = start;
  $("menuBtn").onclick = showMenu;
  $("quitBtn").onclick = showMenu;
  $("resumeBtn").onclick = resume;
  $("pauseBtn").addEventListener("pointerdown", e => { e.stopPropagation(); pause(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
  window.addEventListener("blur", () => { keys.left = keys.right = false; });

  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
